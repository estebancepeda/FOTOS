<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Overlay Honda Black Friday · Auto Mayella</title>
<style>html,body{margin:0;background:transparent}canvas{display:block;width:540px;height:960px}</style></head>
<body>
<canvas id="out"></canvas>
<script type="module">
  import { Renderer, FPS, W, H } from './engine.js';
  const params = new URLSearchParams(location.search);
  const story = await import(`./${params.get('story') || 'story'}.js`);
  await story.load();
  const r = new Renderer(document.getElementById('out'));
  const sub = parseInt(params.get('sub') || '5', 10);
  window.DURATION = story.DURATION;
  window.cues = () => JSON.stringify(story.cues());
  // cuadro f como RGBA crudo (filas de abajo hacia arriba, alfa recto) en base64
  window.grab = async (f) => {
    const used = r.render(f / FPS, story, sub);
    const gl = r.gl, px = new Uint8Array(W * H * 4);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const url = await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(new Blob([px])); });
    return url.slice(url.indexOf(',') + 1);
  };
  window.ready = true;
</script>
</body>
</html>
